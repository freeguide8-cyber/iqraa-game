<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أبطال الارتقاء - لعبة تفاعلية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0f172a; 
            background-image: radial-gradient(circle at top right, #1e1b4b, #0f172a, #312e81);
            color: white;
            overflow-x: hidden;
            user-select: none;
            min-height: 100vh;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes shakeDice {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-20deg) scale(1.1); }
            50% { transform: rotate(20deg) scale(1.1); }
            75% { transform: rotate(-20deg) scale(1.1); }
        }
        .rolling { animation: shakeDice 0.4s infinite; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .board-cell {
            position: relative;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            border-radius: 0.25rem;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
            padding: 3px;
        }
        .board-cell:nth-child(even) { background-color: rgba(255, 255, 255, 0.9); }
        .board-cell:nth-child(odd) { background-color: rgba(226, 232, 240, 0.9); }
        
        .cell-number {
            font-size: clamp(10px, 2vw, 14px);
            color: #1e293b;
            font-weight: 900;
            opacity: 0.8;
            z-index: 1;
            line-height: 1.1;
        }

        /* 🟢 تعديل حجم اللاعبين ليصبح أصغر ومناسب للمربعات 🟢 */
        .player-token {
            width: 4.5%; 
            height: 4.5%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(8px, 1.5vw, 13px);
            font-weight: 900;
            box-shadow: 0 2px 6px rgba(0,0,0,0.8);
            z-index: 50;
            position: absolute;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        /* إزاحة اللاعبين عشان ما يغطون على بعض إذا اجتمعوا في نفس المربع */
        .player-1 { background-color: #ef4444; border: 1.5px solid white; transform: translate(35%, -35%); }
        .player-2 { background-color: #3b82f6; border: 1.5px solid white; transform: translate(-35%, 35%); }

        .btn-glow { transition: all 0.2s; }
        .btn-glow:hover { box-shadow: 0 0 15px currentColor; transform: translateY(-2px); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

        .loader {
            border: 5px solid #1e293b;
            border-top: 5px solid #3b82f6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-2 sm:p-4">

    <!-- شاشة التحميل -->
    <div id="screen-loading" class="w-full max-w-2xl text-center mt-20 animate-pop">
        <h2 class="text-2xl sm:text-3xl font-bold text-cyan-400 mb-4">جاري جلب الدروس من السحابة...</h2>
        <div class="loader"></div>
    </div>

    <!-- شاشة الفصول -->
    <div id="screen-levels" class="w-full max-w-2xl glass-panel rounded-3xl p-6 sm:p-8 text-center animate-pop mt-10 hidden">
        <h1 class="text-3xl sm:text-5xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500 drop-shadow-lg">
            🎮 أبطال الارتقاء 🚀
        </h1>
        <p class="text-sm sm:text-lg text-gray-300 mb-8">اختر الفصل لتبدأ التحدي والمغامرة!</p>
        <div id="levels-container" class="space-y-4 max-w-md mx-auto mb-6 max-h-[60vh] overflow-y-auto pr-2"></div>
    </div>

    <!-- شاشة الدروس -->
    <div id="screen-lessons" class="w-full max-w-3xl glass-panel rounded-3xl p-6 sm:p-8 text-center animate-pop mt-10 hidden">
        <div class="flex justify-between items-center mb-6">
            <h2 id="selected-level-title" class="text-xl sm:text-3xl font-bold text-cyan-400 truncate max-w-[70%]"></h2>
            <button onclick="showScreen('screen-levels')" class="bg-gray-700 hover:bg-gray-600 px-3 sm:px-4 py-2 rounded-lg font-bold text-xs sm:text-base whitespace-nowrap">رجوع ↩</button>
        </div>
        <div id="lessons-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-h-[65vh] overflow-y-auto pr-2"></div>
    </div>

    <!-- شاشة اللعبة -->
    <div id="screen-game" class="w-full max-w-3xl glass-panel rounded-3xl p-3 sm:p-5 animate-pop hidden flex-col items-center relative">
        
        <!-- 🟢 شاشة النرد الكبيرة المنبثقة (تم إرجاعها) 🟢 -->
        <div id="dice-result-display" class="hidden absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-[100] bg-slate-900/95 px-10 py-6 rounded-3xl border-4 border-yellow-400 shadow-[0_0_50px_rgba(250,204,21,0.8)] flex-col items-center justify-center gap-2">
            <span class="text-xl sm:text-2xl text-white font-bold">حصلت على</span>
            <div class="flex items-center gap-4">
                <span class="text-5xl sm:text-7xl" id="popup-dice-icon">🎲</span>
                <span id="dice-result-number" class="text-6xl sm:text-8xl font-black text-yellow-400"></span>
            </div>
        </div>

        <div class="w-full flex justify-between items-center mb-3">
            <h2 id="game-title" class="text-lg sm:text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 truncate max-w-[70%]"></h2>
            <button onclick="confirmExit()" class="bg-red-900/50 hover:bg-red-800 text-red-200 border border-red-700 px-3 py-1.5 rounded-lg font-bold transition text-xs sm:text-sm whitespace-nowrap">خروج 🚪</button>
        </div>

        <!-- لوحة التحكم بالنرد واللاعبين -->
        <div class="w-full flex justify-between items-center bg-slate-800/60 p-2 sm:p-3 rounded-2xl mb-3 border border-slate-600 gap-2 sm:gap-4 relative">
            
            <div id="player-1-card" class="flex-1 flex flex-col sm:flex-row items-center justify-center sm:justify-start gap-1 sm:gap-2 p-2 rounded-xl border-2 border-red-500 bg-red-900/30 transition-all min-w-[70px]">
                <div class="w-7 h-7 sm:w-10 sm:h-10 rounded-full bg-red-500 flex items-center justify-center font-bold text-sm sm:text-lg shadow-[0_0_10px_red]">1</div>
                <div class="text-center sm:text-right">
                    <p class="font-bold text-red-100 text-[10px] sm:text-sm truncate">الأحمر</p>
                    <p class="text-[9px] sm:text-xs text-red-300">مربع: <span id="pos-p1" class="font-black text-[11px] sm:text-sm">1</span></p>
                </div>
            </div>

            <!-- زر النرد -->
            <button onclick="rollDice()" id="btn-roll" class="btn-glow flex flex-col items-center justify-center bg-gradient-to-b from-yellow-400 to-orange-600 text-white rounded-2xl p-2 sm:p-3 shadow-[0_0_15px_rgba(234,179,8,0.5)] border-b-4 border-orange-800 transform active:translate-y-1 active:border-b-0 w-[90px] sm:w-[130px] flex-shrink-0 z-10 transition-colors">
                <span class="text-[9px] sm:text-sm font-bold mb-1 opacity-90" id="turn-indicator">دور الأحمر</span>
                <div class="text-3xl sm:text-5xl drop-shadow-md" id="dice-icon">🎲</div>
                <span class="font-black text-[10px] sm:text-sm mt-1" id="dice-text">ارمي النرد</span>
            </button>

            <div id="player-2-card" class="flex-1 flex flex-col sm:flex-row items-center justify-center sm:justify-start gap-1 sm:gap-2 p-2 rounded-xl border-2 border-transparent opacity-50 transition-all min-w-[70px]">
                <div class="w-7 h-7 sm:w-10 sm:h-10 rounded-full bg-blue-500 flex items-center justify-center font-bold text-sm sm:text-lg">2</div>
                <div class="text-center sm:text-right">
                    <p class="font-bold text-blue-100 text-[10px] sm:text-sm truncate">الأزرق</p>
                    <p class="text-[9px] sm:text-xs text-blue-300">مربع: <span id="pos-p2" class="font-black text-[11px] sm:text-sm">1</span></p>
                </div>
            </div>
        </div>

        <!-- اللوحة التفاعلية مع رسومات SVG المحسنة -->
        <div class="w-full max-w-[600px] aspect-square bg-slate-900 rounded-xl border-4 border-slate-600 shadow-2xl p-1 relative mx-auto overflow-hidden">
            <!-- الشبكة الخلفية -->
            <div id="board-grid" class="w-full h-full grid grid-cols-10 grid-rows-10 gap-[1px] relative z-0"></div>
            <!-- طبقة الرسومات (السلالم والثعابين) -->
            <svg viewBox="0 0 1000 1000" preserveAspectRatio="none" class="absolute inset-0 w-full h-full pointer-events-none z-10" id="svg-layer"></svg>
            <!-- طبقة اللاعبين -->
            <div id="players-layer" class="absolute inset-0 w-full h-full pointer-events-none z-20"></div>
        </div>
    </div>

    <!-- نافذة الكلمة المنبثقة -->
    <div id="modal-word" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-[110] p-4">
        <div class="glass-panel rounded-3xl p-6 sm:p-8 max-w-lg w-full text-center border-2 border-indigo-500 animate-pop shadow-[0_0_50px_rgba(99,102,241,0.5)]">
            <h3 class="text-yellow-400 font-bold text-lg sm:text-xl mb-2">تحدي القراءة!</h3>
            <p id="modal-player-name" class="text-gray-300 mb-6 text-sm sm:text-base">اقرأ هذه الكلمة بصوت واضح:</p>
            <div class="bg-white rounded-2xl p-4 sm:p-10 mb-8 shadow-inner flex justify-center items-center min-h-[120px] sm:min-h-[150px]">
                <p id="modal-word-text" class="text-5xl sm:text-7xl font-black text-slate-900 leading-tight text-center break-words"></p>
            </div>
            <p class="text-xs sm:text-sm text-gray-400 mb-4">تقييم المعلم:</p>
            <div class="flex gap-3 sm:gap-4 justify-center">
                <button onclick="handleAnswer(true)" class="flex-1 btn-glow bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold py-3 sm:py-4 px-2 sm:px-4 rounded-xl text-sm sm:text-xl flex items-center justify-center gap-1 sm:gap-2">✅ صحيحة</button>
                <button onclick="handleAnswer(false)" class="flex-1 btn-glow bg-gradient-to-r from-red-600 to-rose-700 text-white font-bold py-3 sm:py-4 px-2 sm:px-4 rounded-xl text-sm sm:text-xl flex items-center justify-center gap-1 sm:gap-2">❌ خاطئة</button>
            </div>
        </div>
    </div>

    <!-- نافذة الفوز -->
    <div id="modal-winner" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden items-center justify-center z-[110] p-4">
        <div class="glass-panel rounded-3xl p-8 sm:p-10 max-w-md w-full text-center border-2 border-yellow-400 animate-pop">
            <div class="text-7xl sm:text-8xl mb-6">🏆</div>
            <h2 class="text-3xl sm:text-4xl font-black text-yellow-400 mb-2">مبرووووك!</h2>
            <p id="winner-text" class="text-lg sm:text-2xl text-white mb-8"></p>
            <button onclick="resetGameAndGoToMenu()" class="btn-glow w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white font-bold py-4 rounded-xl text-lg sm:text-xl shadow-lg">العودة للقائمة</button>
        </div>
    </div>

    <!-- نافذة تأكيد الخروج -->
    <div id="modal-confirm" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-[110] p-4">
        <div class="glass-panel rounded-3xl p-6 max-w-sm w-full text-center border-2 border-red-500 animate-pop">
            <h3 class="text-xl sm:text-2xl font-bold text-white mb-4">هل أنت متأكد؟</h3>
            <p class="text-gray-300 mb-6 text-sm sm:text-base">ستفقد تقدمك الحالي في اللعبة.</p>
            <div class="flex gap-4">
                <button onclick="document.getElementById('modal-confirm').style.display='none'" class="flex-1 bg-slate-700 hover:bg-slate-600 py-3 rounded-xl font-bold">إلغاء</button>
                <button onclick="resetGameAndGoToMenu(); document.getElementById('modal-confirm').style.display='none'" class="flex-1 bg-red-600 hover:bg-red-500 py-3 rounded-xl font-bold">نعم، اخرج</button>
            </div>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR1G_m-78HQpFchgOcJdJFYC4zA_YgWs-1zDtDhQnl1pT_5BDnRvr1-WFCUy6zmnTwizN_dYLhF2d9s/pub?output=csv'; 
        let database = {}; 
        let currentWordsList = [];
        let cellsOrder = [];
        
        const actualLadders = { 4: 14, 9: 31, 21: 42, 28: 84, 51: 67, 72: 91, 80: 99 };
        const snakes = { 17: 7, 54: 34, 62: 19, 64: 60, 87: 36, 93: 73, 95: 75, 98: 79 };

        let players = [
            { id: 1, pos: 1, oldPos: 1, name: "اللاعب الأحمر", colorClass: "player-1", bgBorder: "border-red-500 bg-red-900/30", color: "#ef4444" },
            { id: 2, pos: 1, oldPos: 1, name: "اللاعب الأزرق", colorClass: "player-2", bgBorder: "border-blue-500 bg-blue-900/30", color: "#3b82f6" }
        ];
        let turn = 0; 
        let isMoving = false;

        window.onload = () => fetchData();

        async function fetchData() {
            try {
                const response = await fetch(CSV_URL);
                const csvText = await response.text();
                parseCSV(csvText);
                renderLevels();
                showScreen('screen-levels');
            } catch (error) {
                console.error(error);
                alert("لم نتمكن من تحميل الدروس! يرجى التأكد من الرابط.");
            }
        }

        function parseCSV(text) {
            let rows = text.split('\n');
            for(let i = 1; i < rows.length; i++) {
                let row = rows[i].trim();
                if(!row) continue;
                let cols = row.split(',').map(c => c.replace(/"/g, '').trim());
                if(cols.length >= 3) {
                    let level = cols[0], lesson = cols[1];
                    let wordsString = cols.slice(2).join(','); 
                    let words = wordsString.split(/[،,-]/).map(w => w.trim()).filter(w => w.length > 0 && w !== "كلمة١" && w !== "كلمة٢" && w !== "كلمة٣");
                    if(words.length === 0) words = ["(أضف كلمات)"];
                    if(!database[level]) database[level] = {};
                    if(!database[level][lesson]) database[level][lesson] = [];
                    database[level][lesson] = database[level][lesson].concat(words);
                }
            }
        }

        function showScreen(screenId) {
            ['screen-loading', 'screen-levels', 'screen-lessons', 'screen-game'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }

        function renderLevels() {
            const container = document.getElementById('levels-container');
            container.innerHTML = '';
            const gradients = ['from-emerald-500 to-green-600', 'from-blue-500 to-indigo-600', 'from-purple-500 to-pink-600', 'from-orange-500 to-red-600'];
            let index = 0;
            for(let levelName in database) {
                let btn = document.createElement('button');
                btn.className = `btn-glow w-full bg-gradient-to-r ${gradients[index % gradients.length]} text-white font-bold py-4 px-6 rounded-xl text-lg sm:text-xl shadow-lg flex items-center justify-between text-right mb-4`;
                btn.onclick = () => { renderLessons(levelName); showScreen('screen-lessons'); };
                btn.innerHTML = `<span class="truncate pr-2">${levelName}</span><span class="text-2xl pl-2">▶</span>`;
                container.appendChild(btn);
                index++;
            }
        }

        function renderLessons(levelName) {
            document.getElementById('selected-level-title').innerText = "📂 " + levelName;
            const container = document.getElementById('lessons-container');
            container.innerHTML = "";
            let lessons = database[levelName];
            for(let lessonName in lessons) {
                let btn = document.createElement('button');
                btn.className = 'bg-slate-800 border-2 border-indigo-500 text-white font-bold p-3 sm:p-4 rounded-xl hover:bg-indigo-600 transition shadow-lg text-xs sm:text-sm text-right';
                btn.innerText = lessonName;
                btn.onclick = () => startGame(lessonName, lessons[lessonName]);
                container.appendChild(btn);
            }
        }

        function startGame(lessonTitle, wordsArr) {
            document.getElementById('game-title').innerText = lessonTitle;
            currentWordsList = wordsArr;
            players.forEach(p => { p.pos = 1; p.oldPos = 1; });
            turn = 0;
            
            generateBoard();
            drawSnakesAndLaddersGraphics();
            updateUI();
            showScreen('screen-game');
            setTimeout(drawTokens, 100);
        }

        function generateBoard() {
            const grid = document.getElementById('board-grid');
            grid.innerHTML = '';
            cellsOrder = [];
            
            for (let r = 9; r >= 0; r--) {
                let rowCells = [];
                for (let c = 0; c < 10; c++) { rowCells.push((r * 10) + c + 1); }
                if (r % 2 !== 0) rowCells.reverse();
                cellsOrder = cellsOrder.concat(rowCells);
            }

            cellsOrder.forEach(num => {
                let cell = document.createElement('div');
                cell.className = 'board-cell';
                cell.id = `cell-${num}`;
                
                let numSpan = document.createElement('span');
                numSpan.className = 'cell-number';
                numSpan.innerText = num;
                
                if(num === 1) numSpan.innerHTML += `<br><span style="font-size: clamp(7px, 1vw, 10px);">البداية</span>`;
                if(num === 100) numSpan.innerHTML += `<br><span style="font-size: clamp(7px, 1vw, 10px);">النهاية</span>`;
                
                cell.appendChild(numSpan);
                grid.appendChild(cell);
            });
        }

        // 🟢 موازنة أحجام الأفاعي والسلالم لتناسب كافة الشاشات 🟢
        function drawSnakesAndLaddersGraphics() {
            const svg = document.getElementById('svg-layer');
            let svgHtml = '';
            
            function getCoords(num) {
                let index = cellsOrder.indexOf(num);
                let row = Math.floor(index / 10), col = index % 10;
                return { x: (9 - col) * 100 + 50, y: row * 100 + 50 }; 
            }

            for (let start in actualLadders) {
                let p1 = getCoords(parseInt(start)), p2 = getCoords(actualLadders[start]);
                let dx = p2.x - p1.x, dy = p2.y - p1.y;
                let angle = Math.atan2(dy, dx);
                let dist = Math.sqrt(dx*dx + dy*dy);
                let nx = -Math.sin(angle) * 12, ny = Math.cos(angle) * 12; 
                
                svgHtml += `<line x1="${p1.x+nx}" y1="${p1.y+ny}" x2="${p2.x+nx}" y2="${p2.y+ny}" stroke="#78350f" stroke-width="10" stroke-linecap="round"/>`;
                svgHtml += `<line x1="${p1.x-nx}" y1="${p1.y-ny}" x2="${p2.x-nx}" y2="${p2.y-ny}" stroke="#78350f" stroke-width="10" stroke-linecap="round"/>`;
                
                let steps = Math.floor(dist / 30);
                for(let i = 1; i < steps; i++) {
                    let px = p1.x + (dx * i / steps), py = p1.y + (dy * i / steps);
                    svgHtml += `<line x1="${px+nx}" y1="${py+ny}" x2="${px-nx}" y2="${py-ny}" stroke="#92400e" stroke-width="6" />`;
                }
            }

            for (let start in snakes) {
                let p1 = getCoords(parseInt(start)); 
                let p2 = getCoords(snakes[start]); 
                let dx = p2.x - p1.x, dy = p2.y - p1.y;
                let angle = Math.atan2(dy, dx);
                let cx = (p1.x + p2.x)/2 - Math.sin(angle)*120;
                let cy = (p1.y + p2.y)/2 + Math.cos(angle)*120;
                
                svgHtml += `<path d="M ${p1.x} ${p1.y} Q ${cx} ${cy} ${p2.x} ${p2.y}" fill="none" stroke="#166534" stroke-width="18" stroke-linecap="round"/>`;
                svgHtml += `<path d="M ${p1.x} ${p1.y} Q ${cx} ${cy} ${p2.x} ${p2.y}" fill="none" stroke="#4ade80" stroke-width="6" stroke-dasharray="12 12" stroke-linecap="round"/>`;
                
                let hx = p1.x - Math.cos(angle)*8, hy = p1.y - Math.sin(angle)*8;
                svgHtml += `<circle cx="${hx}" cy="${hy}" r="16" fill="#166534"/>`;
                
                let ex = Math.cos(angle + Math.PI/2) * 7, ey = Math.sin(angle + Math.PI/2) * 7;
                svgHtml += `<circle cx="${hx+ex}" cy="${hy+ey}" r="5" fill="white"/><circle cx="${hx+ex}" cy="${hy+ey}" r="2" fill="black"/>`;
                svgHtml += `<circle cx="${hx-ex}" cy="${hy-ey}" r="5" fill="white"/><circle cx="${hx-ex}" cy="${hy-ey}" r="2" fill="black"/>`;
                
                let tx1 = hx - Math.cos(angle)*18, ty1 = hy - Math.sin(angle)*18;
                let tx2 = hx - Math.cos(angle)*32, ty2 = hy - Math.sin(angle)*32;
                svgHtml += `<line x1="${tx1}" y1="${ty1}" x2="${tx2}" y2="${ty2}" stroke="#ef4444" stroke-width="3"/>`;
            }
            svg.innerHTML = svgHtml;
        }

        // وضع اللاعبين بناءً على النسبة المئوية (متجاوب 100%)
        function drawTokens() {
            const layer = document.getElementById('players-layer');
            layer.innerHTML = '';
            players.forEach(p => {
                let index = cellsOrder.indexOf(p.pos);
                let row = Math.floor(index / 10), col = index % 10;
                let xPercent = (9 - col) * 10 + 5; 
                let yPercent = row * 10 + 5;

                let token = document.createElement('div');
                token.className = `player-token ${p.colorClass}`;
                token.style.left = `calc(${xPercent}% - 2.25%)`; 
                token.style.top = `calc(${yPercent}% - 2.25%)`;
                token.innerText = p.id;
                layer.appendChild(token);
            });
        }

        function updateUI() {
            document.getElementById('pos-p1').innerText = players[0].pos;
            document.getElementById('pos-p2').innerText = players[1].pos;
            
            let p1Card = document.getElementById('player-1-card'), p2Card = document.getElementById('player-2-card');
            
            if(turn === 0) {
                p1Card.className = `flex-1 flex flex-col sm:flex-row items-center justify-center sm:justify-start gap-1 sm:gap-2 p-2 rounded-xl border-2 transition-all ${players[0].bgBorder} scale-105 shadow-lg min-w-[70px]`;
                p2Card.className = `flex-1 flex flex-col sm:flex-row items-center justify-center sm:justify-start gap-1 sm:gap-2 p-2 rounded-xl border-2 border-transparent opacity-50 transition-all scale-100 min-w-[70px]`;
                document.getElementById('turn-indicator').innerText = "دور الأحمر";
            } else {
                p2Card.className = `flex-1 flex flex-col sm:flex-row items-center justify-center sm:justify-start gap-1 sm:gap-2 p-2 rounded-xl border-2 transition-all ${players[1].bgBorder} scale-105 shadow-lg min-w-[70px]`;
                p1Card.className = `flex-1 flex flex-col sm:flex-row items-center justify-center sm:justify-start gap-1 sm:gap-2 p-2 rounded-xl border-2 border-transparent opacity-50 transition-all scale-100 min-w-[70px]`;
                document.getElementById('turn-indicator').innerText = "دور الأزرق";
            }
        }

        function rollDice() {
            if (isMoving) return;
            isMoving = true;
            
            const icon = document.getElementById('dice-icon');
            icon.classList.add('rolling');
            
            let interval = setInterval(() => {
                icon.innerText = ['🎲','⚀','⚁','⚂','⚃','⚄','⚅'][Math.floor(Math.random() * 6) + 1];
            }, 50);

            setTimeout(() => {
                clearInterval(interval);
                icon.classList.remove('rolling');
                
                let roll = Math.floor(Math.random() * 6) + 1;
                icon.innerText = ['','⚀','⚁','⚂','⚃','⚄','⚅'][roll];
                
                // إظهار النتيجة الضخمة في المنتصف
                let popup = document.getElementById('dice-result-display');
                document.getElementById('dice-result-number').innerText = roll;
                document.getElementById('popup-dice-icon').innerText = icon.innerText;
                
                popup.classList.remove('hidden');
                popup.classList.add('animate-pop');
                popup.style.display = 'flex';
                
                setTimeout(() => {
                    popup.classList.add('hidden');
                    popup.style.display = 'none';
                    popup.classList.remove('animate-pop');
                    movePlayer(roll);
                }, 1500);
                
            }, 600);
        }

        function movePlayer(spaces) {
            let p = players[turn];
            p.oldPos = p.pos; 
            let newPos = p.pos + spaces;
            if (newPos > 100) newPos = 100;
            p.pos = newPos;
            
            drawTokens();
            
            setTimeout(() => {
                document.getElementById('pos-p1').innerText = players[0].pos;
                document.getElementById('pos-p2').innerText = players[1].pos;
                showWordModal();
            }, 700); 
        }

        function showWordModal() {
            let randIndex = Math.floor(Math.random() * currentWordsList.length);
            document.getElementById('modal-word-text').innerText = currentWordsList[randIndex];
            document.getElementById('modal-player-name').innerText = `يا ${players[turn].name}، اقرأ هذه الكلمة:`;
            document.getElementById('modal-word').style.display = 'flex';
        }

        function handleAnswer(isCorrect) {
            document.getElementById('modal-word').style.display = 'none';
            let p = players[turn];
            
            if (isCorrect) {
                if (actualLadders[p.pos]) {
                    setTimeout(() => alert("ممتاز! صعدت السلم 🪜"), 100);
                    p.pos = actualLadders[p.pos];
                }
                else if (snakes[p.pos]) {
                    setTimeout(() => alert("أوه لا! لدغك الثعبان 🐍"), 100);
                    p.pos = snakes[p.pos];
                }
            } else {
                setTimeout(() => alert("قراءة خاطئة ❌ عد للخلف"), 100);
                p.pos = p.oldPos; 
            }
            
            drawTokens();
            
            setTimeout(() => {
                if (p.pos === 100) {
                    document.getElementById('winner-text').innerText = `🏆 ${p.name} هو بطل الارتقاء! 🏆`;
                    document.getElementById('modal-winner').style.display = 'flex';
                    isMoving = false;
                    return;
                }
                turn = turn === 0 ? 1 : 0;
                updateUI();
                document.getElementById('dice-icon').innerText = '🎲';
                isMoving = false;
            }, 600);
        }

        function confirmExit() { document.getElementById('modal-confirm').style.display = 'flex'; }
        function resetGameAndGoToMenu() {
            document.getElementById('modal-winner').style.display = 'none';
            showScreen('screen-levels');
        }
    </script>
</body>
</html>
